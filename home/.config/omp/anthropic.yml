# omp settings of the default profile (Anthropic models). Overlay after common.yml.
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:xhigh
  commit: anthropic/claude-sonnet-5-5:medium
  advisor: anthropic/claude-sonnet-5-5:high
  smol: anthropic/claude-sonnet-5-5:medium
  task: anthropic/claude-sonnet-5-5:high
  tiny: anthropic/claude-haiku-5-5:off
claudeResets:
  autoRedeem: "no"
task:
  enableLsp: true
