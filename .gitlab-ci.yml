# Runs `./dot test` — syntax check, shellcheck, then the bats suite under test/ —
# on the distribution these dotfiles target. Needs a runner with the docker
# executor.
#
# There is no separate lint stage: cmd_test already runs bash -n and shellcheck
# before the tests and stops at the first stage that fails, so a lint job would
# only duplicate the file list it works from.

stages:
  - test

test:
  stage: test
  image: ubuntu:24.04
  variables:
    # shellcheck echoes the offending source line back, and the comments in this
    # repo are full of em-dashes. In the images' default C locale that is a hard
    # error ("commitBuffer: invalid argument"), not a garbled character.
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  before_script:
    - bash test/ci-deps.sh
    # Several failure paths in lib/link.sh are only reachable as an unprivileged
    # user — they are forced by making a directory unwritable, and root ignores
    # that. As root those tests skip and the job goes green for the wrong reason.
    - chown -R runner:runner "$CI_PROJECT_DIR"
  script:
    - su runner -c './dot test'
